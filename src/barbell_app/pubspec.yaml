name: barbell_app
description: "Barbell velocity tracker paired with a BLE sensor."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  android_intent_plus: ^6.1.0
  camera: 0.12.1
  device_info_plus: ^13.3.0
  file_picker: ^13.1.0
  flutter_blue_plus: ^2.3.14
  gal: ^2.3.3
  path_provider: ^2.1.6
  permission_handler: 13.0.2
  share_plus: ^13.3.1
  tflite_flutter: 0.12.1
  video_player: 2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Deadlift models from the reference app (personal use only).
    - assets/models/deadlift/
    - assets/images/

  # Stance's font, from the reference APK.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
